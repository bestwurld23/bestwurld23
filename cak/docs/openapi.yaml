openapi: 3.1.0
info:
  title: Civic Access Kit — Civic Node
  version: 0.1.0
  summary: Offline-first civic information. Not an election office, not a voting machine.
  description: |
    Local HTTP API for one Civic Node. Every route is served from the device; nothing
    here calls out to the internet.

    Public routes are read-only and unauthenticated on purpose: a resident on the kiosk,
    and an auditor with a browser, should not need a credential to check what the node is
    serving or whether its files changed.

    Steward routes require a local password (HTTP Basic, username `steward`). A node with
    no `steward_password_hash` configured has no steward API at all, and a node bound to
    anything other than localhost refuses to start without one.

    This spec is generated by hand alongside `node/cak_node/app.py`; the running node also
    serves a live OpenAPI document at `/openapi.json`.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  x-non-goals:
    - Casting, transmitting, storing or tallying ballots
    - Deciding eligibility, citizenship or any "fraud score"
    - Biometric capture
    - Resident accounts or cloud telemetry

servers:
  - url: http://civic.local:8080
    description: mDNS name on the local network
  - url: http://127.0.0.1:8080
    description: Default bind

tags:
  - name: public
    description: Read-only, unauthenticated, resident and auditor facing.
  - name: changelog
    description: The process ledger. Public by design.
  - name: steward
    description: Local password required. Writes to official/.
  - name: print
    description: Paper Pack rendering.
  - name: kiosk
    description: The no-JavaScript HTML interface.

paths:
  /health:
    get:
      tags: [public]
      summary: Disk, model, file count, pack version, log state
      operationId: health
      responses:
        "200":
          description: Node state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /pack:
    get:
      tags: [public]
      summary: The loaded pack manifest and the hash of every official file
      operationId: getPack
      responses:
        "200":
          description: Pack manifest plus file inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackManifest" }

  /sites:
    get:
      tags: [public]
      summary: Voting sites as GeoJSON (RFC 7946)
      operationId: getSites
      responses:
        "200":
          description: FeatureCollection from the pack
          content:
            application/geo+json:
              schema: { type: object }

  /files/{file_id}:
    get:
      tags: [public]
      summary: Serve one official file verbatim
      description: |
        Only files the index knows about are servable. `official/README.md` is provenance
        prose, not an official document, and returns 404 like any other unknown path.
        The response carries the file's SHA-256 in `X-CAK-SHA256` so a reader can check it
        against the change log without trusting this endpoint.
      operationId: getFile
      parameters:
        - name: file_id
          in: path
          required: true
          schema: { type: string }
          example: official/hours.md
      responses:
        "200":
          description: File contents
          headers:
            X-CAK-SHA256:
              schema: { type: string }
              description: SHA-256 of the bytes returned
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { description: No such official file }

  /agent/query:
    post:
      tags: [public]
      summary: Ask a question; get a cited answer or an honest "I don't know"
      description: |
        The response is never an uncited claim. `status` is `ok` only when the answer is
        supported by excerpts from files on this device; every other outcome —
        out-of-scope question, retrieval below the pack threshold, or a generated answer
        that outran its sources — returns `i_dont_know` with the election office contact.
      operationId: agentQuery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentQuery" }
      responses:
        "200":
          description: Agent response (PRD §11.3)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResponse" }
        "422": { description: Empty or oversized question }

  /agent/prompt:
    get:
      tags: [public]
      summary: The agent's system prompt, verbatim
      description: Published so an auditor does not have to take our word for it.
      operationId: agentPrompt
      responses:
        "200":
          description: Plain text prompt
          content:
            text/plain:
              schema: { type: string }

  /metrics:
    get:
      tags: [public]
      summary: Counters only, no personal data
      operationId: metrics
      responses:
        "200":
          description: Counter lines
          content:
            text/plain:
              schema: { type: string }
              example: |
                cak_queries_ok 41
                cak_queries_i_dont_know 7
                cak_refusals_eligibility 3

  /changelog:
    get:
      tags: [changelog]
      summary: The process ledger and whether the chain verifies
      operationId: getChangelog
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 200 }
      responses:
        "200":
          description: Records plus verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangelogListing" }

  /changelog/verify:
    get:
      tags: [changelog]
      summary: Was this file ever logged on this node?
      description: Paste a SHA-256; find out whether the node ever served that file.
      operationId: verifyHash
      parameters:
        - name: sha256
          in: query
          required: true
          schema: { type: string, minLength: 64, maxLength: 71 }
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyFileResult" }

  /changelog/verify-files:
    get:
      tags: [changelog]
      summary: Does official/ on disk match the log?
      description: |
        Detects a file edited outside the steward flow. This is the check behind the
        acceptance test in PRD §23.
      operationId: verifyFiles
      responses:
        "200":
          description: Directory verification report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfficialDirVerification" }

  /steward/files:
    post:
      tags: [steward]
      summary: Upload and replace one official file
      operationId: stewardUpload
      security: [{ stewardPassword: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                source:
                  type: string
                  description: Provenance note recorded in the change log
      responses:
        "200":
          description: Loaded, logged and re-indexed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StewardLoadResult" }
        "400": { description: File type not permitted in official/ }
        "401": { description: Steward password required or wrong }
        "503": { description: Steward mode disabled (no password configured) }

  /steward/load-folder:
    post:
      tags: [steward]
      summary: Load official files from the USB mount point or a named folder
      operationId: stewardLoadFolder
      security: [{ stewardPassword: [] }]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Folder to load from; defaults to `steward_inbox`
                source: { type: string }
                dry_run:
                  type: boolean
                  default: false
                  description: Report what would change without writing or logging
      responses:
        "200":
          description: Load result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StewardLoadResult" }
        "401": { description: Steward password required or wrong }
        "404": { description: Source folder not found }

  /steward/audit:
    get:
      tags: [steward]
      summary: Audit trail of steward writes
      description: File replacements only. Contains no resident question text.
      operationId: stewardAudit
      security: [{ stewardPassword: [] }]
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { type: object } }
        "401": { description: Steward password required or wrong }

  /print/howto.html:
    get:
      tags: [print]
      summary: Printable how-to card as HTML
      description: Always available; needs no optional dependency.
      operationId: printHowtoHtml
      parameters:
        - { name: language, in: query, schema: { type: string } }
        - name: page
          in: query
          schema: { type: string, enum: [a5, a4, letter, 5x7], default: a5 }
      responses:
        "200":
          description: Print-ready HTML
          content:
            text/html:
              schema: { type: string }

  /print/howto.pdf:
    get:
      tags: [print]
      summary: Printable how-to card as PDF
      operationId: printHowtoPdf
      parameters:
        - { name: language, in: query, schema: { type: string } }
        - name: page
          in: query
          schema: { type: string, enum: [a5, a4, letter, 5x7], default: a5 }
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "503":
          description: WeasyPrint not installed; use /print/howto.html

  /:
    get:
      tags: [kiosk]
      summary: Kiosk page
      description: No JavaScript, no external assets, 18px minimum body text.
      operationId: kiosk
      parameters:
        - { name: language, in: query, schema: { type: string } }
      responses:
        "200":
          description: HTML page
          content:
            text/html:
              schema: { type: string }
    post:
      tags: [kiosk]
      summary: Ask from the kiosk form
      description: |
        POST rather than GET so a resident's question does not land in the URL bar or
        browser history of a shared machine.
      operationId: kioskAsk
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [q]
              properties:
                q: { type: string, minLength: 1, maxLength: 400 }
                language: { type: string }
      responses:
        "200":
          description: HTML page with the answer and its citations
          content:
            text/html:
              schema: { type: string }

components:
  securitySchemes:
    stewardPassword:
      type: http
      scheme: basic
      description: Username `steward`, password from node.toml. Local only, not a cloud account.

  schemas:
    AgentQuery:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        language:
          type: string
          description: Language code; falls back to the pack default if unavailable.

    Citation:
      type: object
      required: [file_id, title, locator, excerpt]
      properties:
        file_id: { type: string, example: official/hours.md }
        title: { type: string, example: Early voting hours }
        locator:
          type: string
          description: Heading anchor, page (`p.3`) or row range — somewhere a human can look.
          example: "#early-voting-hours"
        excerpt: { type: string }
        sha256:
          type: string
          description: Hash of the cited file, checkable against the change log.
        source_url: { type: string, nullable: true }

    Office:
      type: object
      required: [name]
      properties:
        name: { type: string }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        url: { type: string, nullable: true }

    AgentMeta:
      type: object
      description: Non-normative diagnostics. Contains no personal data.
      properties:
        locale_id: { type: string }
        pack_version: { type: string }
        retrieval_max_score: { type: number }
        retrieval_min_score: { type: number }
        files_used: { type: array, items: { type: string } }
        refusal_category:
          type: string
          nullable: true
          enum: [eligibility, partisan, injection, ballot_secrecy, tally_or_casting, null]
        generator: { type: string }
        grounding_failure:
          type: string
          nullable: true
          description: Set when a generated answer was discarded for outrunning its sources.

    AgentResponse:
      type: object
      required: [status, language, answer_markdown, citations, office, disclaimer]
      properties:
        status: { type: string, enum: [ok, i_dont_know, error] }
        language: { type: string }
        answer_markdown: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
          description: Always non-empty when status is `ok`. Always empty otherwise.
        office: { $ref: "#/components/schemas/Office" }
        disclaimer: { type: string }
        meta: { $ref: "#/components/schemas/AgentMeta" }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        locale_id: { type: string }
        pack_version: { type: string }
        official_file_count: { type: integer }
        indexed_chunk_count: { type: integer }
        index_skipped: { type: array, items: { type: string } }
        generator: { type: string, enum: [extractive, ollama] }
        model_loaded: { type: boolean }
        changelog_seq: { type: integer, nullable: true }
        changelog_ok: { type: boolean, nullable: true }
        disk_free_bytes: { type: integer, nullable: true }
        disk_total_bytes: { type: integer, nullable: true }
        offline: { type: boolean }

    PackManifest:
      type: object
      description: The pack.yaml contents plus an inventory of official files.
      properties:
        cak_pack_version: { type: integer, const: 1 }
        locale_id: { type: string }
        name: { type: string }
        authority: { $ref: "#/components/schemas/Office" }
        languages: { type: array, items: { type: string } }
        default_language: { type: string }
        retrieval_min_score: { type: number, minimum: 0, maximum: 1 }
        legal_banner: { type: string }
        time_zone: { type: string }
        does_not: { type: array, items: { type: string } }
        pack_version: { type: string }
        files_license: { type: string, nullable: true }
        official_files:
          type: array
          items:
            type: object
            properties:
              file_id: { type: string }
              title: { type: string }
              media_type: { type: string }
              bytes: { type: integer }
              sha256: { type: string }
              source_url: { type: string, nullable: true }
              retrieved_at: { type: string, nullable: true }
              authority: { type: string, nullable: true }

    ChangelogRecord:
      type: object
      description: One `cak-changelog-1` record. See PRD §8.2.
      properties:
        schema: { type: string, const: cak-changelog-1 }
        log_id: { type: string }
        seq: { type: integer, minimum: 0 }
        ts: { type: string, format: date-time }
        locale_id: { type: string }
        actor_role: { type: string }
        actor_id_hash: { type: string, nullable: true }
        action:
          type: string
          enum: [genesis, add_file, replace_file, remove_file, pack_install, note]
        files:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
              bytes: { type: integer }
              media_type: { type: string }
              source: { type: string, nullable: true }
        note: { type: string, nullable: true }
        pack_public_key:
          type: string
          nullable: true
          description: Genesis only. The Ed25519 public key the chain is signed with.
        prev_hash: { type: string }
        record_hash:
          type: string
          description: SHA-256 over the canonical JSON of the record, excluding record_hash and sig.
        sig:
          type: string
          description: Base64 Ed25519 signature over record_hash.

    ChangelogListing:
      type: object
      properties:
        log_id: { type: string, nullable: true }
        chain_ok: { type: boolean }
        problems: { type: array, items: { type: string } }
        record_count: { type: integer }
        records:
          type: array
          items: { $ref: "#/components/schemas/ChangelogRecord" }

    VerifyFileResult:
      type: object
      properties:
        sha256: { type: string }
        known: { type: boolean }
        records:
          type: array
          items: { $ref: "#/components/schemas/ChangelogRecord" }

    OfficialDirVerification:
      type: object
      properties:
        ok: { type: boolean }
        checked: { type: integer }
        mismatched:
          type: array
          description: Files whose bytes differ from what the log records.
          items:
            type: object
            properties:
              path: { type: string }
              expected_sha256: { type: string }
              actual_sha256: { type: string }
        unlogged:
          type: array
          items: { type: string }
          description: Present on disk but never logged — placed outside the steward flow.
        missing:
          type: array
          items: { type: string }
          description: In the log but gone from disk.

    StewardLoadResult:
      type: object
      properties:
        accepted: { type: array, items: { type: string } }
        rejected:
          type: array
          items: { type: string }
          description: Each entry names the file and why it was refused.
        unchanged:
          type: array
          items: { type: string }
          description: Identical to what is already on the node; not copied, not logged.
        changelog_seq: { type: integer, nullable: true }
        indexed_chunk_count: { type: integer }
